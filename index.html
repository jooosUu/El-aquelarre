<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="El Aquelarre - Enciende tu poder.">
  <title>El Aquelarre — Enciende tu poder</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ======== NAVBAR ======== -->
  <nav class="navbar" id="navbar">
    <!-- .nav-left eliminado según pedido -->
    
    <div class="nav-right">
      <div class="nav-links" id="navLinks">
        <a href="#quienes-somos">NOSOTRAS</a>
        <a href="#informacion">INFORMACIÓN</a>
        <a href="#kits">KITS</a>
        <a href="#contacto">CONTACTO</a>
      </div>
    </div>
  </nav>

  <!-- ======== HERO / INICIO ======== -->
  <section id="inicio" class="hero">
    <!-- Fondo interactivo de partículas -->
    <canvas id="hero-canvas"></canvas>

    <!-- El buscador ahora vive aquí (en el bloque azul) -->
    <div class="search-container">
      <input type="text" placeholder="Buscar" id="searchInput" aria-label="Buscar en el sitio">
      <button class="search-btn" aria-label="Buscar">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </button>
    </div>
    <!-- El logo centrado -->
    <div class="hero-content">
      <img src="Logo.png" alt="El Aquelarre - Enciende tu poder" class="hero-logo">
    </div>
  </section>

  <!-- ======== QUIÉNES SOMOS ======== -->
  <section id="quienes-somos" class="seccion-nosotras anim-container">
    <img src="quienes-somos.png" alt="Fondo quiénes somos" class="fondo-nosotras">
    
    <!-- Fueguitos decorativos -->
    <img src="fueguitos.png" alt="Fueguitos" class="fueguitos-overlay">
    
    <div class="damas-wrapper">
      <img src="Dama-izquierda.png" alt="Dama Izquierda" class="dama-izq">
      <img src="Dama-derecha.png" alt="Dama Derecha" class="dama-der">
    </div>
  </section>

  <!-- ======== INFORMACIÓN ======== -->
  <section id="informacion" class="seccion-info anim-container">
    <img src="rosa-fondo.png" alt="Fondo rosa" class="fondo-rosa">

    <div class="info-layout">
      <!-- Izquierda: Bola naranja con texto integrado -->
      <div class="info-bloque-izq">
        <img src="Informacion3.png" alt="Texto Información" class="img-texto-bola">
      </div>

      <!-- Derecha: Dama Grande -->
      <div class="info-graficos">
        <img src="Fuego-grande -azul.png" alt="Fuego Azul" class="fuego-azul">
        <img src="Dama-grande 1.png" alt="Dama Grande" class="dama-grande">
      </div>
    </div>
    
    <!-- Fuego Base Azul -->
    <div class="fuego-azul-wrapper">
      <img src="fueguito azul.png" alt="Fueguito azul base" class="fueguito-base">
      <img src="fueguito azul.png" alt="Fueguito azul base" class="fueguito-base">
    </div>
  </section>

  <!-- ======== NUESTRO KIT ======== -->
  <section id="kits" class="seccion-kits anim-container">
    <div class="kits-layout">
      
      <!-- Título de la sección -->
      <div class="kits-header">
        <img src="titulo nuestrokit.png" alt="Nuestro Kit" class="titulo-kits" />
      </div>

      <!-- Vitrina interactiva de los elementos del kit -->
      <div class="kit-vitrina">
        
        <!-- Imagen única solicitada: Estrellitas movida y más grande -->
        <img src="estrellitas.png" alt="Estrellitas Kit" class="kit-estrellas-central">

        <!-- Tarjetas desplegadas estéticamente (vuelven a la derecha) -->
        <div class="tarjetas-grupo">
          <img src="tarjeta-2.png" alt="Tarjeta 2" class="kit-tarjeta t2 flotar-t2" onclick="this.classList.toggle('zoomed')">
          <img src="tarjeta-1.png" alt="Tarjeta 1" class="kit-tarjeta t1 flotar-t1" onclick="this.classList.toggle('zoomed')">
        </div>

      </div>
    </div>
  </section>

  <!-- ======== ÚNETE AL CLAN (CON DIVISOR DE FUEGO AZUL) ======== -->
  <section id="contacto" class="seccion-unete anim-container">
    <!-- Divisor decorativo de fuego azul -->
    <div class="divisor-fuego"></div>

    <div class="unete-content">
      <h2 class="unete-titulo">¡ÚNETE A NUESTRO CLAN Y APRENDAMOS JUNTAS!</h2>
      
      <!-- Galería de tarjetas del clan -->
      <div class="clan-tarjetas">
        <img src="tarjeta 1 unete alclan.png" alt="Tarjeta Clan" class="clan-card floating-1">
        <img src="tarjeta 1 unete alclan.png" alt="Tarjeta Clan 2" class="clan-card floating-2">
        <img src="tarjeta 1 unete alclan.png" alt="Tarjeta Clan 3" class="clan-card floating-3">
        <img src="tarjeta 1 unete alclan.png" alt="Tarjeta Clan 4" class="clan-card floating-4">
      </div>
    </div>
    <!-- Divisor inferior extra -->
    <div class="divisor-fuego-inferior"></div>
  </section>

  <!-- Botón Volver al Inicio -->
  <a href="#inicio" class="btn-top" title="Volver al inicio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </a>

  <!-- ======== SCRIPTS ======== -->
  <script>
    const observerOptions = {
      root: null,
      rootMargin: '0px',
      threshold: 0.3
    };

    const observer = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, observerOptions);

    document.querySelectorAll('.anim-container').forEach(section => {
      observer.observe(section);
    });

    /* ======== SISTEMA DE PARTÍCULAS INTERACTIVO ======== */
    const canvas = document.getElementById('hero-canvas');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    const mouse = { x: null, y: null, radius: 100 };

    window.addEventListener('mousemove', (event) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = event.clientX - rect.left;
      mouse.y = event.clientY - rect.top;
    });

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.originX = x;
        this.originY = y;
        this.size = Math.random() * 3 + 1;
        this.color = Math.random() > 0.5 ? '#C90076' : '#EEA2BD'; // Fucsia y Rosa
        this.density = (Math.random() * 30) + 1;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
        
        // Brillo sutil
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
      }
      update() {
        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        let forceDirectionX = dx / distance;
        let forceDirectionY = dy / distance;
        let maxDistance = mouse.radius;
        let force = (maxDistance - distance) / maxDistance;
        let directionX = forceDirectionX * force * this.density;
        let directionY = forceDirectionY * force * this.density;

        if (distance < mouse.radius) {
          this.x -= directionX;
          this.y -= directionY;
        } else {
          // Efecto Resorte (Spring)
          if (this.x !== this.originX) {
            let dx = this.x - this.originX;
            this.x -= dx / 15;
          }
          if (this.y !== this.originY) {
            let dy = this.y - this.originY;
            this.y -= dy / 15;
          }
        }
      }
    }

    function init() {
      canvas.width = canvas.parentElement.offsetWidth;
      canvas.height = canvas.parentElement.offsetHeight;
      particlesArray = [];
      const numberOfParticles = (canvas.width * canvas.height) / 8000;
      for (let i = 0; i < numberOfParticles; i++) {
        let x = Math.random() * canvas.width;
        let y = Math.random() * canvas.height;
        particlesArray.push(new Particle(x, y));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].draw();
        particlesArray[i].update();
      }
      requestAnimationFrame(animate);
    }

    init();
    animate();

    window.addEventListener('resize', () => {
      init();
    });
  </script>

</body>
</html>
